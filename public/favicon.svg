<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="favBgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0c4a6e" />
      <stop offset="100%" stop-color="#082f49" />
    </radialGradient>
    <linearGradient id="favIceTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <linearGradient id="favIceFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Squircle App Icon Backdrop -->
  <rect width="60" height="60" x="2" y="2" rx="16" fill="url(#favBgGlow)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Tiny Ears (Centered around Y=17) -->
  <ellipse cx="20" cy="17" rx="4.5" ry="6" fill="#3c4556" stroke="#2e384d" stroke-width="2" transform="rotate(-18 20 17)" />
  <ellipse cx="44" cy="17" rx="4.5" ry="6" fill="#3c4556" stroke="#2e384d" stroke-width="2" transform="rotate(18 44 17)" />

  <!-- Chubby Cream Body / Head (Centered Y=13 to 53) -->
  <path
    d="M 21 21
       C 21 13 43 13 43 21
       C 43 27 48 37 46 47
       C 44 53 20 53 18 47
       C 16 37 21 27 21 21 Z"
    fill="#fdfbf7"
    stroke="#2e384d"
    stroke-width="2.4"
    stroke-linejoin="round"
  />

  <!-- Whiskers -->
  <path d="M 14 29 Q 18 30 22 30" stroke="#2e384d" stroke-width="1.4" stroke-linecap="round" fill="none" />
  <path d="M 14 34 Q 18 34 22 33" stroke="#2e384d" stroke-width="1.4" stroke-linecap="round" fill="none" />
  <path d="M 50 29 Q 46 30 42 30" stroke="#2e384d" stroke-width="1.4" stroke-linecap="round" fill="none" />
  <path d="M 50 34 Q 46 34 42 33" stroke="#2e384d" stroke-width="1.4" stroke-linecap="round" fill="none" />

  <!-- Eyes with twinkle -->
  <ellipse cx="27" cy="27" rx="2" ry="2.8" fill="#2e384d" />
  <circle cx="26.3" cy="25.8" r="0.7" fill="#ffffff" />
  <ellipse cx="37" cy="27" rx="2" ry="2.8" fill="#2e384d" />
  <circle cx="36.3" cy="25.8" r="0.7" fill="#ffffff" />

  <!-- Soft Blush -->
  <ellipse cx="22" cy="30" rx="3.5" ry="2" fill="#fecdd3" fill-opacity="0.9" />
  <ellipse cx="42" cy="30" rx="3.5" ry="2" fill="#fecdd3" fill-opacity="0.9" />

  <!-- Cute Nose & Mouth -->
  <path d="M 30.5 28.5 Q 32 27.5 33.5 28.5 Q 32 30.5 30.5 28.5 Z" fill="#2e384d" />

  <!-- Mini Isometric Glowing Ice Cube (Centered at X=32, Y=37 to 51) -->
  <polygon points="32,37 39,41 32,45 25,41" fill="url(#favIceTop)" stroke="#60a5fa" stroke-width="1.2" stroke-linejoin="round" />
  <polygon points="25,41 32,45 32,51 25,47" fill="url(#favIceFront)" stroke="#60a5fa" stroke-width="1.2" stroke-linejoin="round" />
  <polygon points="32,45 39,41 39,47 32,51" fill="#60a5fa" stroke="#3b82f6" stroke-width="1.2" stroke-linejoin="round" />
  <polygon points="32,38.5 36,40.5 32,42.5 28,40.5" fill="#ffffff" fill-opacity="0.75" />

  <!-- Paws hugging ice cube -->
  <path d="M 23 42 C 26 42 28 45 25 49" stroke="#2e384d" stroke-width="2" stroke-linecap="round" fill="none" />
  <path d="M 41 42 C 38 42 36 45 39 49" stroke="#2e384d" stroke-width="2" stroke-linecap="round" fill="none" />
</svg>
